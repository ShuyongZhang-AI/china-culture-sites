<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国·名人文化地图</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif; }
  #map { position: absolute; inset: 0; width: 100%; height: 100vh; }

  /* ---------- 页面加载状态 ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(252, 250, 245, 0.98);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px; margin-bottom: 14px;
    border: 4px solid #e4dbc8; border-top-color: #a93526;
    border-radius: 50%; box-sizing: border-box;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
  }

  /* ---------- 顶部标题 ---------- */
  .brand {
    position: absolute; top: 16px; left: 16px; z-index: 1000;
    background: rgba(250, 247, 240, 0.94);
    border: 1px solid #d6c9b3; border-radius: 12px;
    padding: 12px 18px; box-shadow: 0 4px 18px rgba(31, 26, 20, 0.18);
    user-select: none; max-width: 330px;
  }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: 2px; color: #2b2620; }
  .brand h1 .dot { color: #a93526; }
  .brand p { margin: 4px 0 0; font-size: 12px; color: #7a6f5d; letter-spacing: 1px; line-height: 1.5; }

  /* ---------- 左侧地点列表 ---------- */
  .panel-list {
    position: absolute; left: 16px; top: 96px; bottom: 70px; width: 288px; z-index: 1000;
    background: rgba(250, 247, 240, 0.96);
    border: 1px solid #d6c9b3; border-radius: 12px;
    box-shadow: 0 4px 18px rgba(31, 26, 20, 0.18);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-list .hd { padding: 12px 14px 8px; border-bottom: 1px solid #e4dbc8; }
  .panel-list .hd .t { font-size: 15px; color: #2b2620; letter-spacing: 1px; }
  .panel-list .hd .n { font-size: 11px; color: #95886f; margin-top: 2px; }
  .panel-list .hd { position: relative; }
  .list-close {
    position: absolute; right: 8px; top: 10px;
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid #cfc2a8; background: #fffdf7; color: #5d5342;
    font-size: 16px; line-height: 1; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .list-close:hover { border-color: #a93526; color: #a93526; background: #faf0ec; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid #e4dbc8; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 20px; cursor: pointer;
    border: 1px solid #cfc2a8; color: #5d5342; background: #faf6ec; letter-spacing: 1px;
  }
  .chip.on { color: #fff; border-color: #2b2620; background: #2b2620; }
  .search {
    margin: 10px 14px 0; padding: 7px 12px; border-radius: 8px;
    border: 1px solid #cfc2a8; background: #fffdf7; color: #3d382e;
    font-size: 12.5px; font-family: inherit; outline: none;
  }
  .search:focus { border-color: #a93526; }
  /* 区域切换 */
  .regions { display: flex; flex-wrap: wrap; gap: 5px; padding: 9px 12px 0; }
  .regions .rg {
    font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid #cfc2a8; color: #5d5342; background: #fffdf7; letter-spacing: .5px;
    transition: all .15s; white-space: nowrap;
  }
  .regions .rg:hover { border-color: #a93526; color: #a93526; }
  .regions .rg.on { background: #a93526; border-color: #a93526; color: #fff; }
  .site-groups { overflow-y: auto; flex: 1; padding: 6px 8px 12px; }
  .prov {
    font-size: 12px; color: #95886f; letter-spacing: 2px;
    margin: 10px 8px 4px; display: flex; align-items: center; gap: 8px;
  }
  .prov::after { content: ""; flex: 1; height: 1px; background: #e4dbc8; }
  .site-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
  }
  .site-item:hover { background: #efe8d8; }
  .site-item.active { background: #e6dcc4; box-shadow: inset 0 0 0 1px #cbbd9d; }
  .site-item .ic { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.4); }
  .site-item .nm { font-size: 13px; color: #33302a; line-height: 1.35; }
  .site-item .ps { font-size: 11px; color: #95886f; margin-top: 1px; }

  /* ---------- 右侧详情面板 ---------- */
  .detail {
    position: absolute; right: 16px; top: 16px; bottom: 70px; width: 400px; z-index: 1100;
    background: rgba(252, 250, 245, 0.97);
    border: 1px solid #d6c9b3; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(31, 26, 20, 0.25);
    overflow-y: auto; overflow-x: hidden;
    transform: translateX(calc(100% + 32px)); transition: transform 0.35s ease;
  }
  .detail.open { transform: translateX(0); }
  .detail .close {
    position: absolute; top: 10px; right: 12px; z-index: 5;
    width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(43, 38, 32, 0.55); color: #fff; font-size: 16px; line-height: 30px; padding: 0;
  }
  .detail .close:hover { background: rgba(43, 38, 32, 0.85); }
  /* ---------- 详情页图片相册（可左右滑动） ---------- */
  .hero { position: relative; background: #e8e0cf; border-radius: 11px 11px 0 0; overflow: hidden; }
  .slides {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; -ms-overflow-style: none; cursor: grab;
  }
  .slides::-webkit-scrollbar { display: none; }
  .slides.drag { cursor: grabbing; scroll-snap-type: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: center; position: relative; }
  .slide img {
    width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block;
    -webkit-user-drag: none; user-select: none; pointer-events: auto;
    transition: transform 0.35s ease;
  }
  .slide img.img-full {
    position: fixed; inset: 0; z-index: 2000;
    width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important;
    object-fit: contain; background: #000; cursor: zoom-out;
  }
  .slide img.img-maxhint::after { content: '双击放大'; }
  .slide .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 8px;
    background: linear-gradient(to top, rgba(20,17,13,0.78), rgba(20,17,13,0));
    color: #fdfaf4; font-size: 11.5px; line-height: 1.5; letter-spacing: .5px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
  }
  .slide .cap .crd { font-size: 10px; opacity: .72; white-space: nowrap; }
  .hero .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(28,24,19,0.42); color: #fff; font-size: 17px; line-height: 30px; padding: 0;
    opacity: 0; transition: opacity .2s;
  }
  .hero:hover .nav { opacity: 1; }
  .hero .nav:hover { background: rgba(28,24,19,0.72); }
  .hero .nav.prev { left: 8px; }
  .hero .nav.next { right: 8px; }
  .hero .dots {
    position: absolute; left: 0; right: 0; bottom: 40px; z-index: 3;
    display: flex; justify-content: center; gap: 5px; pointer-events: none;
  }
  .hero .dots i {
    width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.55);
    box-shadow: 0 0 2px rgba(0,0,0,.5); transition: all .2s;
  }
  .hero .dots i.on { width: 16px; border-radius: 3px; background: #fff; }
  .hero .idx {
    position: absolute; left: 10px; top: 10px; z-index: 3;
    background: rgba(28,24,19,0.45); color: #fff; font-size: 10.5px;
    padding: 2px 8px; border-radius: 10px; letter-spacing: .5px;
  }
  .src-note {
    font-size: 11px; color: #8d8268; padding: 6px 20px 0; letter-spacing: .5px;
  }
  .detail .body { padding: 16px 20px 22px; }
  .tags { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 10px; border-radius: 20px; color: #fff; letter-spacing: 1px; }
  .tag.memorial { background: #a93526; }
  .tag.tomb { background: #3f5d4e; }
  .tag.culture { background: #2f6d8c; }
  .tag.plain { background: #8a7f68; }
  .detail h2 { margin: 0 0 6px; font-size: 22px; color: #2b2620; letter-spacing: 1px; }
  .detail .person {
    font-size: 13px; color: #6b5f49; padding: 8px 12px; margin: 10px 0 12px;
    background: #f2ecdd; border-left: 3px solid #a93526; border-radius: 0 8px 8px 0;
  }
  .detail p { font-size: 13.5px; line-height: 1.9; color: #454036; margin: 0 0 10px; text-align: justify; }
  .detail .sec {
    font-size: 13px; color: #a93526; letter-spacing: 3px; margin: 16px 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .detail .sec::after { content: ""; flex: 1; height: 1px; background: #e4dbc8; }
  .detail ul.hl { margin: 0; padding: 0; list-style: none; }
  .detail ul.hl li {
    font-size: 13px; color: #454036; padding: 5px 0 5px 18px; position: relative; line-height: 1.6;
  }
  .detail ul.hl li::before { content: "◆"; position: absolute; left: 0; color: #b39b6a; font-size: 10px; top: 8px; }
  .detail .addr {
    margin-top: 16px; font-size: 12.5px; color: #6b5f49; line-height: 1.7;
    background: #f2ecdd; border-radius: 8px; padding: 10px 12px;
  }
  .detail .addr b { color: #4a4436; }

  /* ---------- 地图中央弹出大图覆盖层 ---------- */
  #imgModal {
    position: fixed; inset: 0; z-index: 3000;
    background: rgba(10, 8, 6, 0.92);
    display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #imgModal.open { display: flex; }
  #imgModal .modal-close {
    position: absolute; top: 18px; right: 24px; z-index: 10;
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 22px; line-height: 44px;
    text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  #imgModal .modal-close:hover { background: rgba(255,255,255,0.25); }
  #imgModal .modal-img {
    max-width: 92vw; max-height: 88vh; object-fit: contain;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6); border-radius: 8px;
    cursor: zoom-out;
  }
  #imgModal .modal-cap {
    position: absolute; bottom: 30px; left: 0; right: 0; z-index: 5;
    color: #fff; font-size: 13px; text-align: center; letter-spacing: 1px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6); pointer-events: none;
  }

  /* ---------- 名人作品专区（与地点实景分离） ---------- */
  .extra-section { margin: 16px 0 4px; border-top: 1px solid #e4dbc8; padding-top: 12px; }
  .extra-section .sec { font-size: 13px; color: #a93526; letter-spacing: 3px; margin: 12px 0 10px; display: flex; align-items: center; gap: 8px; }
  .extra-section .sec::after { content: ""; flex: 1; height: 1px; background: #e4dbc8; }
  .extra-section .works { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .extra-section .work { flex: 0 0 calc(50% - 4px); position: relative; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; border: 1px solid #d6c9b3; background: #e8e0cf; cursor: pointer; }
  .extra-section .work img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .extra-section .work .wcap { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px; background: linear-gradient(to top, rgba(20,17,13,0.75), rgba(20,17,13,0)); color: #fff; font-size: 10px; line-height: 1.4; }

  /* ---------- 诗文专区 ---------- */
  .extra-section .writings { margin: 8px 0; }
  .extra-section .writing { margin: 10px 0; padding: 10px 12px; background: #faf6ec; border-radius: 8px; border: 1px solid #efe8d8; }
  .extra-section .writing .wtitle { font-size: 14px; color: #2b2620; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; }
  .extra-section .writing .wtype { font-size: 10px; color: #a93526; letter-spacing: 1px; padding: 1px 6px; border-radius: 8px; background: #f2ecdd; }
  .extra-section .writing .classical { font-size: 13.5px; color: #454036; line-height: 1.8; margin: 4px 0 4px; text-align: justify; font-family: "Noto Serif SC", "Source Han Serif SC", serif; white-space: pre-wrap; }
  .extra-section .writing .vernacular { white-space: pre-wrap; font-size: 12.5px; color: #6b5f49; line-height: 1.7; margin: 4px 0 8px; border-left: 3px solid #b39b6a; padding-left: 10px; text-align: justify; font-style: italic; }
  .extra-section .writing .analysis { font-size: 11.5px; color: #8a7f68; line-height: 1.6; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #d6c9b3; }

  /* ---------- 名人介绍可折叠 ---------- */
  .desc-wrap { position: relative; margin: 0 0 10px; }
  .desc-wrap .desc-collapsed { overflow: hidden; max-height: 78px; }
  .desc-wrap .desc-expanded { max-height: none; }
  .btn-desc-more {
    display: inline-block; margin-top: 6px; font-size: 12px; color: #a93526;
    cursor: pointer; text-decoration: underline; padding: 4px 10px;
    border: 1px solid #e4dbc8; border-radius: 12px; background: #faf6ec;
  }
  .btn-desc-more:hover { background: #efe8d8; }

  /* ---------- 名人作品扩展展示 ---------- */
  .extra { margin: 14px 0 4px; border-top: 1px solid #e4dbc8; padding-top: 10px; }
  .extra .sec { font-size: 13px; color: #a93526; letter-spacing: 3px; margin: 12px 0 8px; display: flex; align-items: center; gap: 8px; }
  .extra .sec::after { content: ""; flex: 1; height: 1px; background: #e4dbc8; }
  /* 画廊（画家/书法家作品） */
  .works { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .work { flex: 0 0 calc(50% - 4px); position: relative; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; border: 1px solid #d6c9b3; background: #e8e0cf; cursor: pointer; }
  .work img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .work .wcap { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px; background: linear-gradient(to top, rgba(20,17,13,0.75), rgba(20,17,13,0)); color: #fff; font-size: 10px; line-height: 1.4; }
  /* 诗文（诗人/散文家） */
  .writings { margin: 8px 0; }
  .writing { margin: 10px 0; padding: 10px 12px; background: #faf6ec; border-radius: 8px; border: 1px solid #efe8d8; }
  .writing .wtitle { font-size: 14px; color: #2b2620; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; }
  .writing .wtype { font-size: 10px; color: #a93526; letter-spacing: 1px; padding: 1px 6px; border-radius: 8px; background: #f2ecdd; }
  .writing .classical { font-size: 13.5px; color: #454036; line-height: 1.8; margin: 4px 0 4px; text-align: justify; font-family: "Noto Serif SC", "Source Han Serif SC", serif; }
  .writing .vernacular { font-size: 12.5px; color: #6b5f49; line-height: 1.7; margin: 4px 0 8px; border-left: 3px solid #b39b6a; padding-left: 10px; text-align: justify; font-style: italic; }
  .writing .analysis { font-size: 11.5px; color: #8a7f68; line-height: 1.6; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #d6c9b3; }

  /* ---------- 图例 & 控件 ---------- */
  .legend {
    position: absolute; left: 320px; bottom: 16px; z-index: 1000;
    background: rgba(250, 247, 240, 0.94); border: 1px solid #d6c9b3; border-radius: 10px;
    padding: 8px 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    box-shadow: 0 4px 14px rgba(31, 26, 20, 0.15); font-size: 12px; color: #4a4436;
    max-width: calc(100% - 400px);
  }
  .legend .lg { display: flex; align-items: center; gap: 6px; }
  .legend .ic { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.4); }
  .ctrl {
    position: absolute; right: 16px; bottom: 16px; z-index: 1000;
    display: flex; flex-direction: column; gap: 8px; transition: right 0.35s ease;
  }
  .ctrl button {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid #d6c9b3; cursor: pointer;
    background: rgba(250, 247, 240, 0.95); color: #2b2620; font-size: 18px; font-family: inherit;
    box-shadow: 0 4px 14px rgba(31, 26, 20, 0.15);
  }
  .ctrl button:hover { background: #efe8d8; }
  .credit {
    position: absolute; right: 16px; bottom: 66px; z-index: 999;
    font-size: 11px; color: #6f6552; background: rgba(250, 247, 240, 0.85);
    padding: 4px 10px; border-radius: 6px; writing-mode: vertical-rl; letter-spacing: 2px;
  }
  .detail.open ~ .ctrl { right: 440px; }

  /* 滚动条 */
  .site-groups::-webkit-scrollbar, .detail::-webkit-scrollbar { width: 6px; }
  .site-groups::-webkit-scrollbar-thumb, .detail::-webkit-scrollbar-thumb { background: #cfc2a8; border-radius: 3px; }

  .list-toggle { display: none; }

  @media (max-width: 960px) {
    .panel-list { display: none; }
    .panel-list.show { display: flex; }
    .list-toggle {
      display: block; position: absolute; left: 16px; top: 96px; z-index: 1200;
      padding: 8px 14px; border-radius: 8px; border: 1px solid #d6c9b3; cursor: pointer;
      background: rgba(250, 247, 240, 0.95); color: #2b2620; font-size: 13px; font-family: inherit;
      box-shadow: 0 4px 14px rgba(31,26,20,0.15);
    }
    .panel-list.show + .list-toggle { display: none; }
    .detail { width: min(92vw, 400px); }
    .legend { display: none; }
    .ctrl { right: 16px; }
    .detail.open ~ .ctrl { right: 16px; }
    .credit { display: none; }
  }
</style>

<body>
<div id="loader" role="status" aria-label="加载中">
  <div class="spinner" aria-hidden="true"></div>
  <div style="margin-top:14px;font-size:13px;color:#7a6f5d;letter-spacing:2px;">加 载 中</div>
</div>
<div id="map"></div>

<div class="brand">
  <h1>中国<span class="dot">·</span>名人文化地图</h1>
  <p>34 省级行政区 · 纪念馆 · 故居 · 墓地 · 文化场所</p>
</div>

<button class="list-toggle" id="listToggle" onclick="document.getElementById('siteList').classList.add('show'); closeDetail();">☰ 地点列表</button>

  <div class="panel-list" id="siteList">
    <div class="hd">
      <div class="t">地点总览</div>
      <div class="n" id="siteCount"></div>
      <button class="list-close" onclick="closeSiteList()">✕</button>
    </div>
  <div class="regions" id="regions"></div>
  <input class="search" id="searchBox" placeholder="🔍 搜索地点 / 人物…" oninput="setSearch(this.value)">
  <div class="filters" id="filters"></div>
  <div class="site-groups" id="siteGroups"></div>
</div>

<aside class="detail" id="detail"></aside>

<div id="imgModal">
  <button class="modal-close" onclick="closeImgModal()">✕</button>
  <img id="modalImg" class="modal-img" src="" alt="" ondblclick="toggleImgModal()">
  <div class="modal-cap" id="modalCap"></div>
</div>

<div class="legend" id="legend"></div>

<div class="ctrl" id="ctrl">
  <button title="放大" onclick="zoomBy(1)">＋</button>
  <button title="缩小" onclick="zoomBy(-1)">－</button>
  <button title="回到当前区域全览" onclick="overview()">⌂</button>
</div>

<div class="credit" id="credit">底图 © 腾讯位置服务</div>

<script>
/* ================= 数据：全国名人文化地点（按省级行政区） ================= */
const CATS = {
  memorial: { label: '纪念馆·故居', color: '#a93526' },
  tomb:     { label: '墓地·陵园', color: '#3f5d4e' },
  culture:  { label: '文化场所',   color: '#2f6d8c' },
};

const SITES = [
  /* ================= 上海市 ================= */
  {
    id: 'luxun-shanghai', prov: 'shanghai', cat: 'memorial',
    name: '上海鲁迅纪念馆 · 鲁迅墓',
    person: '鲁迅（1881—1936）',
    role: '中国现代文学奠基人',

      "classical": "五人者，盖当蓼洲周公之被逮，激于义而死焉者也。至于今，郡之贤士大夫请于当道，即除魏阉废祠之址以葬之，且立石于其墓之门，以旌其所为。呜呼，亦盛矣哉！\n\n夫五人之死，去今之墓而葬焉，其为时止十有一月耳。夫十有一月之中，凡富贵之子，慷慨得志之徒，其疾病而死，死而湮没不足道者，亦已众矣，况草野之无闻者欤？独五人之皦皦，何也？\n\n予犹记周公之被逮，在丁卯三月之望。吾社之行为士先者，为之声义，敛资财以送其行，哭声震动天地。缇骑按剑而前，问：“谁为哀者？”众不能堪，抶而仆之。是时以大中丞抚吴者，为魏之私人，周公之逮所由使也。吴之民方痛心焉，于是乘其厉声以呵，则噪而相逐，中丞匿于溷藩以免。既而以吴民之乱请于朝，按诛五人，曰：颜佩韦、杨念如、马杰、沈扬、周文元，即今之傫然在墓者也。\n\n然五人之当刑也，意气扬扬，呼中丞之名而詈之，谈笑以死。断头置城上，颜色不少变。有贤士大夫发五十金，买五人之脰而函之，卒与尸合。故今之墓中，全乎为五人也。\n\n嗟夫！大阉之乱，缙绅而能不易其志者，四海之大，有几人欤？而五人生于编伍之间，素不闻诗书之训，激昂大义，蹈死不顾，亦曷故哉？且矫诏纷出，钩党之捕遍于天下，卒以吾郡之发愤一击，不敢复有株治。大阉亦逡巡畏义，非常之谋，难于猝发。待圣人之出而投缳道路，不可谓非五人之力也！\n\n由是观之，则今之高爵显位，一旦抵罪，或脱身以逃，不能容于远近，而又有剪发杜门，佯狂不知所之者。其辱人贱行，视五人之死，轻重固何如哉？是以蓼洲周公，忠义暴于朝廷，赠谥美显，荣于身后；而五人亦得以加其土封，列其姓名于大堤之上。凡四方之士，无有不过而拜且泣者，斯固百世之遇也！不然，令五人者保其首领，以老于户牖之下，则尽其天年，人皆得以隶使之，安能屈豪杰之流，扼腕墓道，发其志士之悲哉？故予与同社诸君子，哀斯墓之徒有其石也，而为之记，亦以明死生之大，匹夫之有重于社稷也。\n\n贤士大夫者：冏卿因之吴公，太史文起文公，孟长姚公也。",
      "vernacular": "这五人是在周蓼洲先生被捕时，因义愤而牺牲的人。如今本郡贤士请求官府，清理魏忠贤废祠的旧址，将他们安葬，并在墓门前立碑表彰他们的事迹。啊，这真是隆重啊！\n\n五人遇难到现在修墓安葬，只隔了十一个月。这期间，富贵得志的人病死之后默默无闻的已很多，更何况乡间无名的百姓？为何偏偏这五人如此光耀呢？\n\n我记得周公被捕是在三月十五。同社品行出众的人替他伸张正义，筹钱送行，哭声震动天地。差役按剑上前，问谁在哭；众人忍无可忍，将他们打倒。当时巡抚吴地的大中丞是魏忠贤的党羽，周公被捕正是他指使的。吴地百姓正恨他，他厉声呵斥时，大家便喊叫着追赶；他躲进厕所旁才逃脱。后来他向朝廷告称吴民作乱，追究处死了颜佩韦、杨念如、马杰、沈扬、周文元五人，就是现在并葬墓中的人。\n\n五人临刑时神情昂扬，直呼巡抚姓名痛骂，谈笑着赴死。头颅被挂在城上，脸色没有改变。有贤士拿出五十两银子买下头颅，用匣子装好，最终与遗体合葬，因此墓中葬着完整的五人。\n\n唉，魏忠贤作乱时，天下做官的人有几个能不改变志节？五人出身平民，平日没有受过诗书教育，却能为大义激励，赴死不回头，这是为什么？当时假诏不断，追捕党人的行动遍及天下，最终因为本郡百姓奋起反抗，阉党不敢再肆意株连。魏忠贤也畏惧正义，阴谋难以突然发动；直到新君即位，他在被发配途中自缢。作者认为，这不能说没有五人的功劳。\n\n由此看来，那些高官一旦获罪，有的逃走却无处容身，有的削发闭门或装疯逃避。他们卑劣的行为和五人的死相比，孰轻孰重？因此周公的忠义得到朝廷表彰，身后获得褒赠；五人也得以筑墓立碑，四方人士经过时无不拜祭流泪，这是百世难得的际遇。假如他们保全性命在家老去，即使活到天年，也只是任人驱使，又怎能令豪杰在墓前扼腕悲叹？所以我与同社诸君感叹墓前徒有石碑，便写下此记，以说明生死的重大意义，以及平民对国家的重要性。\n\n文中的贤士大夫，是太仆卿吴因之、太史文文起和姚孟长。",
      "analysis": "记叙苏州市民抗争及五义士遇难，强调普通人在国家中的分量。文中年份各版本有异；事件一般记作1626年，此处按所列版本保留「丁卯」。",
      "source": "https://gwgz.5000yan.com/zhangpo/12012.html"
    }
  ],

      "title": "《项脊轩志》",
      "type": "古文",
      "classical": "项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。\n\n然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是，东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰：“某所，而母立于兹。”妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”语未毕，余泣，妪亦泣。余自束发，读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”瞻顾遗迹，如在昨日，令人长号不自禁。\n\n轩东，故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。\n\n项脊生曰：“蜀清守丹穴，利甲天下，其后秦皇帝筑女怀清台；刘玄德与曹操争天下，诸葛孔明起陇中。方二人之昧昧于一隅也，世何足以知之？余区区处败屋中，方扬眉、瞬目，谓有奇景。人知之者，其谓与坎井之蛙何异？”\n\n余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。\n\n庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。",
      "vernacular": "项脊轩是原来的南阁子，屋子只有一丈见方，容一人居住。百年老屋漏下尘土和雨水，挪动桌案时环顾四周竟无处安放；屋子朝北，不见阳光，过午便暗了。我略加修缮，不再漏雨，又开四窗，在庭院周围筑墙反射南面的日光，屋里才明亮。庭中杂植兰、桂、竹木，旧栏杆也更好看了。借来的书摆满书架，我或吟咏，或静坐；院中寂静，鸟儿来啄食，见人也不飞走。月圆之夜，月光映着半墙，桂树影子随风摇动，十分可爱。\n\n然而我住在这里，喜事多，悲事也多。以前院子南北相通，叔伯分家后，内外小门和墙随处可见：东家的狗跑到西家叫，客人穿过厨房赴宴，鸡在厅中栖息。院里先筑篱笆，后来又改成墙，变了两次。家有一位老仆妇，是已故祖母的婢女，哺育过两代人，亡母待她很好。屋西连着内室，母亲曾来过。老妇常对我说：“你母亲曾站在这里。”她又回忆：姐姐在她怀里啼哭，母亲敲门问孩子冷不冷、想不想吃东西，她在门外应答。话没说完，我哭了，她也哭了。我从束发之年在轩里读书，一天祖母来看我，问为何整天安静得像个姑娘。临走她掩门自语，盼望我能有出息；不久拿来象牙笏板，说这是她祖父当年上朝所用，希望我将来也能用上。回想往事如在昨日，令人忍不住大哭。\n\n轩东从前是厨房，人们往来都从门前经过。我关窗居住，久而久之，能凭脚步声辨认来人。轩曾四次遭遇火灾而未烧毁，仿佛有神灵护佑。\n\n项脊生说：巴蜀的清守着丹砂矿而富甲天下，秦始皇后来为她筑台；刘备与曹操争天下，诸葛亮从隆中出山。他们尚未显达、居于一隅时，世人怎能知道？我居于破屋，却为眼前景物自得，别人知道了，恐怕会笑我像井底之蛙吧。\n\n写此志五年后，我的妻子嫁来，常到轩中向我问古事，有时靠着桌案练字。她回娘家时转述妹妹们的话：“听说姐姐家有阁子，阁子是什么呢？”又过六年妻子去世，屋子破了也没有修。两年后我久病无聊，才让人重新修葺南阁，形制与以前略有不同。从此我常在外面，不常住在这里。\n\n院里有一棵枇杷树，是妻子去世那年她亲手种的，如今已枝叶高大如伞。",
      "analysis": "从书斋的日常景物写到母亲、祖母和妻子，末尾枇杷树寄托深沉的怀念。",

    }

/* ================= 自定义图标：大头钉（内联 SVG），右侧可带类别批注 ================= */
const PIN_SHORT = { memorial: '纪念馆', tomb: '陵墓', culture: '文化' };
const PIN_BASE = { w: 50, h: 62, tipX: 24, tipY: 54 };   /* 无批注时的画布与钉尖位置 */
const PIN_FONT = 12.5;

function pinSrc(color, cat, withText) {
  const text = PIN_SHORT[cat] || '';
  const labelW = text ? Math.round(text.length * PIN_FONT + 26) : 0;
  const W = withText ? 46 + labelW + 2 : PIN_BASE.w;
  /* 大头钉：大圆钉帽 + 短钉尖，一笔成形（无接缝） */
  const body = 'M24 55 C24 55 6.8 32.6 6.8 19 A17.2 17.2 0 1 1 41.2 19 C41.2 32.6 24 55 24 55 Z';

  let svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + PIN_BASE.h + '" viewBox="0 0 ' + W + ' ' + PIN_BASE.h + '">'
    + '<defs><radialGradient id="g" cx="36%" cy="26%" r="82%">'
    + '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>'
    + '<stop offset="52%" stop-color="#ffffff" stop-opacity="0.05"/>'
    + '<stop offset="100%" stop-color="#1a1410" stop-opacity="0.22"/>'
    + '</radialGradient></defs>'
    /* 落地投影 */
    + '<ellipse cx="24" cy="55.6" rx="7" ry="2.4" fill="rgba(25,20,14,0.18)"/>'
    /* 钉身：白色描边做出“贴纸”质感，再叠一层柔和球面光 */
    + '<path d="' + body + '" fill="' + color + '" stroke="#fdfaf4" stroke-width="3.2" stroke-linejoin="round"/>'
    + '<path d="' + body + '" fill="url(#g)"/>'
    /* 钉帽中心的白点 */
    + '<circle cx="24" cy="19" r="5.4" fill="#fdfaf4" opacity="0.97"/>'
    + '<circle cx="24" cy="19" r="2" fill="' + color + '" opacity="0.5"/>';

  if (withText && text) {
    svg += '<g>'
      + '<rect x="46" y="9.5" width="' + labelW + '" height="24" rx="12" fill="#fdfaf4" fill-opacity="0.97" stroke="' + color + '" stroke-width="1.7"/>'
      + '<text x="' + (46 + labelW / 2) + '" y="26.4" text-anchor="middle" font-size="' + PIN_FONT + '" font-weight="600"'
      + ' font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" fill="' + color + '">' + text + '</text>'
      + '</g>';
  }
  svg += '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ================= 初始化地图 ================= */
/* 首屏即是全国视野：所有点位一次全部插钉，拖动地图即可看到外地景点 */
const map = new TMap.Map('map', {
  center: new TMap.LatLng(32.00, 110.00),
  zoom: 4.5
});

/* 标记样式：大头钉 + 选中放大态；带批注/不带批注两套（低视野只显示钉子） */
function pinDims(cat, withText, sel) {
  const text = PIN_SHORT[cat] || '';
  const labelW = (withText && text) ? Math.round(text.length * PIN_FONT + 26) : 0;
  const W = withText ? 46 + labelW + 2 : PIN_BASE.w;
  const k = sel ? 1.26 : 1;
  return {
    width: Math.round(W * k),
    height: Math.round(PIN_BASE.h * k),
    anchor: { x: PIN_BASE.tipX * k, y: PIN_BASE.tipY * k }
  };
}

const styles = {};
Object.keys(CATS).forEach(function (k) {
  [[false, ''], [true, '-txt']].forEach(function (v) {
    const src = pinSrc(CATS[k].color, k, v[0]);
    [false, true].forEach(function (sel) {
      const d = pinDims(k, v[0], sel);
      styles[k + v[1] + (sel ? '-sel' : '')] = new TMap.MarkerStyle({
        width: d.width, height: d.height, anchor: d.anchor, src: src,
        enableRelativeScale: true,
        relativeScaleOptions: { scaleZoom: 13, minScale: 0.7, maxScale: 1.05 }
      });
    });
  });
});

const markerLayer = new TMap.MultiMarker({
  id: 'site-markers',
  map: map,
  styles: styles,
  geometries: []
});

const labelLayer = new TMap.MultiLabel({
  id: 'site-labels',
  map: map,
  styles: {
    'label': new TMap.LabelStyle({
      color: '#2b2620',
      size: 12,
      offset: { x: 0, y: 8 },
      angle: 0,
      alignment: 'center',
      verticalAlignment: 'top'
    })
  },
  geometries: []
});

/* ================= 状态与渲染 ================= */
let activeFilter = 'all';
let searchTerm = '';
let selectedId = null;
let regionKey = 'all';

function inRegion(s) {
  return REGIONS[regionKey].provs.indexOf(s.prov) !== -1;
}

function visibleSites() {
  const kw = searchTerm.trim();
  return SITES.filter(function (s) {
    /* 有关键词时跨区域搜索，方便直接找到外省地点 */
    if (!kw && !inRegion(s)) return false;
    if (activeFilter !== 'all' && s.cat !== activeFilter) return false;
    if (kw && (s.name + s.person + s.role + s.city + s.address).indexOf(kw) === -1) return false;
    return true;
  });
}

/* ---------- 区域切换 ---------- */
function renderRegions() {
  document.getElementById('regions').innerHTML = Object.keys(REGIONS).map(function (k) {
    return '<span class="rg' + (k === regionKey ? ' on' : '') + '" onclick="setRegion(\'' + k + '\')">'
      + REGIONS[k].label + '</span>';
  }).join('');
}

/* Web Mercator 辅助：用于自己算缩放与中心，一次定位到位（不依赖 fitBounds 的动画） */
function mercY(lat) {
  const s = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
}
function invMercY(y) {
  return Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180 / Math.PI;
}

var lastFitW = 0, lastFitH = 0;
function fitRegion() {
  /* 全国用固定的中国范围，其余按区域内实际点位；都一次算出缩放，避免二次移动 */
  const b = REGIONS[regionKey].cn || regionBounds(regionKey);   // [[南,西],[北,东]]
  const s = b[0][0], w = b[0][1], n = b[1][0], e = b[1][1];

  const el = document.getElementById('map');
  const W = (el && el.clientWidth) || 0;
  const H = (el && el.clientHeight) || 0;
  if (!W || !H) return;                       // 容器还没尺寸，等事件再触发

  /* 左侧列表压住地图左边一条，把可用区域右移，内容就不会藏在面板下面 */
  let panelRight = 0;
  try {
    const panel = document.getElementById('siteList');
    if (panel && window.getComputedStyle(panel).display !== 'none') {
      const r = panel.getBoundingClientRect();
      if (r.width) panelRight = r.left + r.width;
    }
  } catch (err) {}

  const availW = Math.max(W - panelRight - 28, 260);
  const availH = Math.max(H - 36, 260);

  const spanY = Math.abs(mercY(s) - mercY(n)) || 1e-6;
  const spanX = Math.abs(e - w) / 360 || 1e-6;
  let z = Math.min(Math.log2(availW / (256 * spanX)), Math.log2(availH / (256 * spanY)));
  z = Math.max(3, Math.min(18, Math.round(z * 100) / 100));

  const lat = invMercY((mercY(s) + mercY(n)) / 2);
  const lngC = (w + e) / 2;
  /* 把 bbox 中心从容器中心右移半个面板宽，等价于中心经度往西挪 */
  const pxPerDeg = 256 * Math.pow(2, z) / 360;
  const dLng = (panelRight / 2) / pxPerDeg;

  try {
    map.setZoom(z);
    map.setCenter(new TMap.LatLng(lat, lngC - dLng));
    lastFitW = W; lastFitH = H;
  } catch (err) { /* 视野异常时保留当前视野 */ }
}

/* 视野按区域内实际点位计算，避免大面积空白 */
function regionBounds(k) {
  const provs = REGIONS[k].provs;
  let a = 90, b = -90, c = 180, d = -180, n = 0;
  SITES.forEach(function (s) {
    if (provs.indexOf(s.prov) === -1) return;
    n++;
    a = Math.min(a, s.lat); b = Math.max(b, s.lat);
    c = Math.min(c, s.lng); d = Math.max(d, s.lng);
  });
  if (!n) return REGIONS[k].b;
  const py = Math.max((b - a) * 0.10, 0.15);
  const px = Math.max((d - c) * 0.10, 0.15);
  return [[a - py, c - px], [b + py, d + px]];
}

function setRegion(k) {
  if (!REGIONS[k]) return;
  regionKey = k;
  closeDetail();
  renderRegions();
  fitRegion();
  rebuildMarkers();
  rebuildLabels();
  renderList();
  updateHeader();
}

/* 图钉的类别批注：放大到 10 级以上或选中时显示，避免低视野挤成一片 */
function showPinText() {
  let z = 10;
  try { z = map.getZoom(); } catch (e) {}

}

let lastTextState = null;

function rebuildMarkers() {
  const vis = visibleSites();
  const txt = showPinText();

/* 地名标签：低缩放级别隐藏，放大到 10 级以上或选中时显示，避免拥挤 */
function rebuildLabels() {

function renderList() {
  const vis = visibleSites();
  document.getElementById('siteCount').textContent = '共 ' + vis.length + ' 处 · 点击定位查看详情';
  const box = document.getElementById('siteGroups');
  let html = '';
  PROV_ORDER.forEach(function (p) {
    const items = vis.filter(function (s) { return s.prov === p; });
    if (!items.length) return;
    html += '<div class="prov">' + PROVS[p] + '</div>';
    /* 按城市聚合（顺序沿用数据中出现顺序），避免新增地点散落 */
    const order = [];
    const groups = {};
    items.forEach(function (s) {
      if (!groups[s.city]) { groups[s.city] = []; order.push(s.city); }
      groups[s.city].push(s);
    });
    order.forEach(function (c) {
      html += '<div class="prov" style="font-size:11px;letter-spacing:1px;">' + c + '</div>';
      groups[c].forEach(function (s) {
        html += '<div class="site-item' + (s.id === selectedId ? ' active' : '') + '" onclick="selectSite(\'' + s.id + '\')">'
          + '<span class="ic" style="background:' + CATS[s.cat].color + '"></span>'
          + '<span><div class="nm">' + s.name + '</div><div class="ps">' + s.person + '</div></span></div>';

}

function detailShots(s) {
  const photoKey = s.photoKey || s.id;

  return {
    shots: [{ src: illusSrc(s), cap: s.name, credit: isIllus ? '水墨插画 · 示意' : '水墨示意卡 · 暂无实景照片' }],

function renderDesc(s) {
  var full = (s.desc || []).join('\n');
  var collapsed = full.length > 200 ? full.slice(0, 200) + '…' : full;
  if (full.length <= 200) {
    return '<div class="desc-wrap"><div class="desc-collapsed desc-expanded">' + full.split('\n').map(function(p){return '<p>'+p+'</p>';}).join('') + '</div></div>';
  }
  return '<div class="desc-wrap">'
    + '<div class="desc-collapsed">' + collapsed.split('\n').map(function(p){return '<p>'+p+'</p>';}).join('') + '</div>'
    + '<div class="desc-expanded" style="display:none">' + full.split('\n').map(function(p){return '<p>'+p+'</p>';}).join('') + '</div>'
    + '<span class="btn-desc-more" id="btnDescMore" onclick="toggleDesc(this)">显示更多</span>'
    + '</div>';

/* 切换介绍展开/收起 */
function toggleDesc(btn) {
  var wrap = btn.closest('.desc-wrap');
  var collapsed = wrap.querySelector('.desc-collapsed');
  var expanded = wrap.querySelector('.desc-expanded');
  if (!collapsed || !expanded) return;
  if (collapsed.style.display !== 'none') {
    collapsed.style.display = 'none';
    expanded.style.display = 'block';
    btn.textContent = '收起';
  } else {
    collapsed.style.display = 'block';
    expanded.style.display = 'none';
    btn.textContent = '显示更多';
  }
}

    });

  var additions = (SUPPLEMENTAL_WRITINGS[s.id] || []).concat(MODERN_WRITINGS[MODERN_WRITING_KEYS[s.id]] || []);
  var writings = additions.concat((s.writings || []).filter(function (old) {

  if (writings.length) {
    out += '<div class="extra-section"><div class="sec">代 表 诗 文</div><div class="writings">';
    writings.forEach(function (w) {

      if (w.classical) out += '<div class="classical">' + w.classical + '</div>';
      if (w.vernacular) out += '<div class="vernacular">『白话』' + w.vernacular + '</div>';
      if (w.analysis) out += '<div class="analysis">『解析』' + w.analysis + '</div>';
      if (w.source) out += '<div class="analysis"><a href="' + w.source + '" target="_blank" rel="noopener noreferrer">' + (w.sourceLabel || '原文参考') + '</a>' + (w.vernacular ? ' · 白话译文为本站编写' : '') + '</div>';
      out += longText ? '</details>' : '</div>';
    });
    out += '</div></div>';
  }
  return out;
}

/* ---------- 相册：滑动、圆点、箭头 ---------- */
function slideEl() { return document.getElementById('slides'); }
function curSlide() {
  const el = slideEl();
  if (!el) return 0;
  return Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
}
function slideBy(n) {
  const el = slideEl();
  if (!el) return;
  const total = el.children.length;
  const i = Math.min(total - 1, Math.max(0, curSlide() + n));
  el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
}
function slideTo(i) {
  const el = slideEl();
  if (!el) return;
  el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
}
function onSlidesScroll() {
  const el = slideEl();
  if (!el) return;
  const i = curSlide();
  const dots = document.getElementById('slideDots');
  if (dots) {
    Array.prototype.forEach.call(dots.children, function (d, k) { d.className = k === i ? 'on' : ''; });
    if (dots.children[i]) {
      /* 圆点可点击跳转 */
      Array.prototype.forEach.call(dots.children, function (d, k) {
        d.onclick = function () { slideTo(k); };
        d.style.pointerEvents = 'auto';
      });
    }
  }
  const idx = document.getElementById('slideIdx');
  if (idx) idx.textContent = (i + 1) + ' / ' + el.children.length;
}
function bindSlideDrag() {
  const el = slideEl();
  if (!el) return;
  el.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') slideBy(-1);
    if (e.key === 'ArrowRight') slideBy(1);
  });
  let down = false, startX = 0, startL = 0, moved = 0;
  el.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    down = true; moved = 0; startX = e.clientX; startL = el.scrollLeft;
    el.classList.add('drag');
  });
  el.addEventListener('pointermove', function (e) {
    if (!down) return;
    const dx = e.clientX - startX;
    moved = Math.abs(dx);
    el.scrollLeft = startL - dx;
  });
  const end = function () {
    if (!down) return;
    down = false; el.classList.remove('drag');
    if (moved > 6) {
      const w = el.clientWidth;
      const i = Math.round(el.scrollLeft / Math.max(1, w));
      el.scrollTo({ left: i * w, behavior: 'smooth' });
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('dragstart', function (e) { e.preventDefault(); });
}

function flyTo(latLng, zoom) {
  try { map.easeTo({ center: latLng, zoom: zoom }, { duration: 700 }); }
  catch (e) { try { map.setCenter(latLng); map.setZoom(zoom); } catch (e2) {} }
}

  activeFilter = k;
  if (selectedId) {
    const still = visibleSites().some(function (s) { return s.id === selectedId; });
    if (!still) { selectedId = null; document.getElementById('detail').classList.remove('open'); }
  }
  rebuildMarkers();
  rebuildLabels();
  renderList();
  renderFilters();
  updateHeader();
}

function zoomBy(d) {
  try { map.setZoom(map.getZoom() + d); } catch (e) {}
}

function overview() {
  closeDetail();
  fitRegion();
}

/* 点击地图上的小图标 → 右侧显示详情 */
markerLayer.on('click', function (evt) {
  if (evt.geometry && evt.geometry.id) {
    selectSite(evt.geometry.id, false);
  }
});

/* 缩放变化时刷新地名标签 / 图钉批注显示（仅在跨过阈值时重建图钉，避免抖动） */
function onZoomChange() {
  if (showPinText() !== lastTextState) rebuildMarkers();
  rebuildLabels();
}
try { map.on('zoom', onZoomChange); } catch (e) {}
try { map.on('zoomend', onZoomChange); } catch (e) {}

/* Esc 关闭详情、大图和地点列表 */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeDetail(); closeImgModal(); closeSiteList(); }
});

/* 初始化 */
renderRegions();
renderFilters();
renderLegend();
rebuildMarkers();
rebuildLabels();
renderList();
updateHeader();

/* 首屏把视野拉到整个中国：Map 容器拿到尺寸后再算，避免首帧瓦片异常 */
(function startFit() {
  let done = false, tries = 0, prevW = 0, prevH = 0;
  function apply() {
    if (done) return;
    const el = document.getElementById('map');
    if (!el || !el.clientWidth) { if (tries++ < 40) setTimeout(apply, 250); return; }
    /* 容器尺寸要连续两次一致才算稳定，否则会把视野算小 */
    const W = el.clientWidth, H = el.clientHeight;
    if ((W !== prevW || H !== prevH) && tries++ < 40) {
      prevW = W; prevH = H;
      setTimeout(apply, 220);
      return;
    }
    done = true;
    try { fitRegion(); } catch (e) {}
  }
  try { map.on('complete', apply); } catch (e) {}
  setTimeout(apply, 400);

  /* 之后 12 秒内若容器尺寸又变了（字体、滚动条、窗口变化），再适配一次 */
  let ticks = 0;
  const timer = setInterval(function () {
    if (++ticks > 24) { clearInterval(timer); return; }
    const el = document.getElementById('map');
    if (!el || !el.clientWidth) return;
    if (Math.abs(el.clientWidth - lastFitW) > 4 || Math.abs(el.clientHeight - lastFitH) > 4) {
      try { fitRegion(); } catch (e) {}
    }
  }, 500);
})();

/* 页面及资源加载完成后隐藏加载状态 */
window.addEventListener('load', function () {
  setTimeout(function () {
    var loader = document.getElementById('loader');
    if (loader) loader.classList.add('hidden');
  }, 700);
});
</script>
